version: '3.8'

# Shannon 核心服务
# Orchestrator + Agent Core + LLM Service

services:
  # Shannon Orchestrator - 编排器
  shannon-orchestrator:
    image: shannon/orchestrator:latest
    container_name: shannon-orchestrator
    restart: unless-stopped
    environment:
      # 数据库配置
      DATABASE_URL: postgres://${POSTGRES_USER:-shannon}:${POSTGRES_PASSWORD:-shannon_password}@postgres:5432/${POSTGRES_DB:-shannon_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      
      # Shannon 配置
      SHANNON_LOG_LEVEL: ${LOG_LEVEL:-info}
      SHANNON_WORKER_COUNT: ${WORKER_COUNT:-4}
      SHANNON_QUEUE_SIZE: ${QUEUE_SIZE:-1000}
      
      # API 配置
      API_TOKEN: ${SHANNON_API_TOKEN:-shannon_api_token}
      JWT_SECRET: ${JWT_SECRET:-jwt_secret}
      
      # 预算配置
      DEFAULT_USER_DAILY_BUDGET: ${DEFAULT_USER_DAILY_BUDGET:-1.0}
      DEFAULT_MAX_TOKENS: ${DEFAULT_MAX_TOKENS:-4000}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-100}
      
      # 监控配置
      ENABLE_METRICS: "true"
      ENABLE_TRACING: "true"
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    ports:
      - "${SHANNON_ORCHESTRATOR_PORT:-8080}:8080"
    volumes:
      - ./config/shannon-config.yml:/etc/shannon/config.yml:ro
      - ./logs/shannon:/var/log/shannon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - shannon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # Shannon Agent Core - 代理核心
  shannon-agent-core:
    image: shannon/agent-core:latest
    container_name: shannon-agent-core
    restart: unless-stopped
    environment:
      RUST_LOG: ${LOG_LEVEL:-info}
      ORCHESTRATOR_URL: http://shannon-orchestrator:8080
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      
      # 工具配置
      ENABLE_MCP: "true"
      ENABLE_OPENAPI: "true"
      ENABLE_WASI: "true"
      
      # 安全配置
      SANDBOX_ENABLED: "true"
      MAX_EXECUTION_TIME: "300"
      
      # 监控
      ENABLE_METRICS: "true"
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    ports:
      - "${SHANNON_AGENT_CORE_PORT:-8081}:8081"
    volumes:
      - ./logs/shannon:/var/log/shannon
    depends_on:
      - shannon-orchestrator
    networks:
      - shannon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Shannon LLM Service - LLM 服务
  shannon-llm-service:
    image: shannon/llm-service:latest
    container_name: shannon-llm-service
    restart: unless-stopped
    environment:
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-4}
      
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-claude-3-5-sonnet-20241022}
      
      # DeepSeek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_DEFAULT_MODEL: ${DEEPSEEK_DEFAULT_MODEL:-deepseek-chat}
      
      # 服务配置
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ORCHESTRATOR_URL: http://shannon-orchestrator:8080
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/2
      
      # 重试配置
      MAX_RETRIES: "3"
      RETRY_DELAY: "1000"
      
      # 监控
      ENABLE_METRICS: "true"
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
    ports:
      - "${SHANNON_LLM_SERVICE_PORT:-8082}:8082"
    volumes:
      - ./logs/shannon:/var/log/shannon
    depends_on:
      - shannon-orchestrator
    networks:
      - shannon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  shannon-network:
    external: true
    name: ${NETWORK_NAME:-shannon-network}

